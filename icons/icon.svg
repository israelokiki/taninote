<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#363c7e"/>
      <stop offset="0.55" stop-color="#232857"/>
      <stop offset="1" stop-color="#141632"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#8f95ff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#8f95ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#8f95ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.55" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f3b61f"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa1b8"/>
      <stop offset="0.35" stop-color="#f4f6fb"/>
      <stop offset="0.7" stop-color="#c3c8d8"/>
      <stop offset="1" stop-color="#8a90a8"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9c8ff"/>
      <stop offset="0.45" stop-color="#efe6ff"/>
      <stop offset="1" stop-color="#b9a4f2"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9c48e"/>
      <stop offset="0.5" stop-color="#fbe2b8"/>
      <stop offset="1" stop-color="#d9ac70"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0b0d24" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- sparkle -->
  <path d="M404 86 L 412 106 L 432 114 L 412 122 L 404 142 L 396 122 L 376 114 L 396 106 Z" fill="#fff4cf" opacity="0.9"/>
  <path d="M112 392 L 117 404 L 129 409 L 117 414 L 112 426 L 107 414 L 95 409 L 107 404 Z" fill="#fff4cf" opacity="0.8"/>

  <!-- pencil shadow -->
  <ellipse cx="270" cy="452" rx="58" ry="12" fill="#05061a" opacity="0.45" filter="url(#soft)"/>

  <!-- pencil (stem of the T) -->
  <g>
    <!-- eraser -->
    <path d="M216 120 C 216 96 232 84 256 84 C 280 84 296 96 296 120 L 296 136 L 216 136 Z" fill="url(#eraser)"/>
    <!-- ferrule -->
    <rect x="212" y="134" width="88" height="36" rx="4" fill="url(#ferrule)"/>
    <rect x="212" y="145" width="88" height="4" fill="#7e849c" opacity="0.6"/>
    <rect x="212" y="156" width="88" height="4" fill="#7e849c" opacity="0.6"/>
    <!-- body facets -->
    <rect x="214" y="168" width="28" height="200" fill="#f7a3c0"/>
    <rect x="242" y="168" width="28" height="200" fill="#f48aae"/>
    <rect x="270" y="168" width="28" height="200" fill="#d8678f"/>
    <rect x="236" y="168" width="6" height="200" fill="#ffffff" opacity="0.25"/>
    <!-- sharpened wood -->
    <path d="M214 368 C 224 376 232 364 242 372 C 252 380 260 364 270 372 C 280 380 288 366 298 368 L 256 452 Z" fill="url(#wood)"/>
    <!-- graphite -->
    <path d="M241 422 L 271 422 L 256 452 Z" fill="#232857"/>
  </g>

  <!-- shadow the stroke casts on the pencil -->
  <rect x="214" y="236" width="84" height="34" fill="url(#shade)"/>

  <!-- highlighter stroke (crossbar of the T) -->
  <path d="M112 168 C 210 150 320 146 426 154 L 404 232 C 302 224 200 228 88 246 Z" fill="url(#bar)" stroke="url(#bar)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M128 176 C 220 162 320 158 404 164" fill="none" stroke="#fff6c2" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <path d="M120 230 C 190 222 250 220 310 220" fill="none" stroke="#e7a414" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
</svg>
